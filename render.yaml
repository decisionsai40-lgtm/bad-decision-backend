services:
  - type: web
    name: bad-decision-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: BACKEND_API_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEYS
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: OSM_NOMINATIM_USER_AGENT
        sync: false
      - key: OSM_OVERPASS_ENDPOINT
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
