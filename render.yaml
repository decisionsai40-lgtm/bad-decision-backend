services:
  - type: web
    name: bad-decision-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DEEPSEEK_API_KEYS
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: OPENCORPORATES_API_TOKEN
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
    plan: free
