services:
  - type: web
    name: bad-decision-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: BACKEND_API_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEYS
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SCRAPINGANT_API_KEY
        sync: false
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
      - key: OUTSCRAPER_API_KEY
        sync: false
      - key: YELP_FUSION_API_KEY
        sync: false
      - key: BROWSERLESS_API_KEY
        sync: false
      - key: CHECKNUMBER_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: OSM_NOMINATIM_USER_AGENT
        sync: false
      - key: OSM_OVERPASS_ENDPOINT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
